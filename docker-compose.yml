version: '3.8'

services:
  # PostgreSQL 15 with PostGIS 3.3 extension
  postgres:
    image: postgis/postgis:15-3.3
    container_name: darukaa_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: darukaa_earth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d darukaa_earth"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darukaa_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROJECT_NAME: "Darukaa.Earth Production API"
      ENVIRONMENT: "production"
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/darukaa_earth"
      SECRET_KEY: "darukaa-production-geospatial-carbon-secret-key-2026"
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      BACKEND_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost"
      PORT: 8000
    ports:
      - "8000:8000"

  # Frontend React SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: darukaa_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: "http://localhost:8000/api/v1"
      VITE_MAPBOX_TOKEN: ""
    ports:
      - "5173:80"

volumes:
  postgres_data:
    driver: local
