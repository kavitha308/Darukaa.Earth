databases:
  - name: darukaa-postgis-db
    databaseName: darukaa_earth
    user: darukaa_user
    plan: standard
    postgresMajorVersion: 15
    ipAllowList: []

services:
  # FastAPI Backend Web Service
  - type: web
    name: darukaa-earth-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: "Darukaa.Earth Backend"
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-postgis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 120
      - key: BACKEND_CORS_ORIGINS
        value: "https://darukaa-earth.onrender.com,http://localhost:5173"

  # React Frontend Static Site
  - type: web
    name: darukaa-earth-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: "https://darukaa-earth-backend.onrender.com/api/v1"
      - key: VITE_MAPBOX_TOKEN
        sync: false
